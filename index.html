<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutay2048</title>
    <!-- Dinamik Icon / Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181c'/><rect x='10' y='10' width='80' height='80' rx='15' fill='%23edc22e'/><text x='50' y='62' font-size='32' font-weight='bold' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'>2048</text></svg>">
    
    <style>
        :root {
            --bg-color: #121216;
            --panel-bg: #1e1e24;
            --grid-bg: #2a2a38;
            --empty-tile: #373748;
            --accent-color: #4a90e2;
            --text-light: #f0f0f5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EKRANLAR */
        .screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            color: #edc22e;
            text-shadow: 0 0 15px rgba(237, 194, 46, 0.4);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a0a0b0;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
        }

        .btn {
            background-color: var(--accent-color);
            color: var(--text-light);
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 6px 15px rgba(74, 144, 226, 0.4);
        }

        .btn-continue {
            background-color: #2ecc71;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        .btn-continue:hover {
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.5);
        }

        .btn-secondary {
            background-color: var(--panel-bg);
            border: 1px solid #444;
        }

        /* HEADER & ÜST PANEL */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scores {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background-color: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
            min-width: 85px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .score-title {
            font-size: 0.7rem;
            color: #888;
            font-weight: bold;
        }

        .score-val {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        /* TAHTA VE IZGARA */
        .board-container {
            position: relative;
            background-color: var(--grid-bg);
            border-radius: 12px;
            padding: 10px;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            gap: 10px;
            position: relative;
        }

        .cell {
            background-color: var(--empty-tile);
            border-radius: 8px;
            width: 100%;
            height: 100%;
        }

        /* KARELER VE GÜNCELLENMİŞ EFEKTLER */
        .tile-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.12s ease-out;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            will-change: transform;
            transform-origin: center center;
        }

        /* Yumuşak Doğma Efekti */
        .tile-new {
            animation: appear 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Şık ve Kibar Birleşme Efekti */
        .tile-merged {
            animation: mergePop 0.15s ease-out;
            z-index: 10;
        }

        @keyframes appear {
            0% { opacity: 0; scale: 0.5; }
            100% { opacity: 1; scale: 1; }
        }

        @keyframes mergePop {
            0% { scale: 1; }
            50% { scale: 1.08; }
            100% { scale: 1; }
        }

        /* KARE RENKLERİ */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; box-shadow: 0 0 10px #edcf72; }
        .tile-256 { background: #edcc61; color: #f9f6f2; box-shadow: 0 0 12px #edcc61; }
        .tile-512 { background: #edc850; color: #f9f6f2; box-shadow: 0 0 15px #edc850; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; box-shadow: 0 0 20px #edc53f; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 25px #edc22e; }
        .tile-super { background: #3c3a32; color: #f9f6f2; }

        /* OYUN BİTTİ EKRANI */
        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 22, 0.88);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            animation: appear 0.3s ease;
            z-index: 20;
        }

        .game-over h2 {
            font-size: 2.5rem;
            color: #ff5555;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,85,85,0.5);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ANA MENÜ -->
    <div id="menu-screen" class="screen">
        <h1 class="title">Kutay2048</h1>
        <p class="subtitle">Boyut Seçin ve Oynamaya Başlayın</p>
        <div class="menu-buttons">
            <button id="btn-continue" class="btn btn-continue hidden" onclick="resumeGame()">Devam Et</button>
            <button class="btn" onclick="startNewGame(3)">3x3 Modu</button>
            <button class="btn" onclick="startNewGame(4)">4x4 Klasik</button>
            <button class="btn" onclick="startNewGame(5)">5x5 Modu</button>
            <button class="btn" onclick="startNewGame(6)">6x6 Modu</button>
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="controls">
                <button class="btn btn-secondary btn-sm" onclick="showMenu()">Menü</button>
                <button class="btn btn-secondary btn-sm" onclick="undoMove()">↺ Geri Al</button>
                <button class="btn btn-secondary btn-sm" onclick="restartGame()">Yeniden</button>
            </div>
            <div class="scores">
                <div class="score-box">
                    <div class="score-title">SKOR</div>
                    <div id="score" class="score-val">0</div>
                </div>
                <div class="score-box">
                    <div class="score-title">EN YÜKSEK</div>
                    <div id="best-score" class="score-val">0</div>
                </div>
            </div>
        </div>

        <div class="board-container" id="board-container">
            <div class="grid" id="grid-bg"></div>
            <div class="tile-container" id="tile-container"></div>
            
            <div id="game-over-overlay" class="game-over hidden">
                <h2>Oyun Bitti!</h2>
                <button class="btn" onclick="restartGame()">Tekrar Dene</button>
            </div>
        </div>
    </div>
</div>

<script>
    let gridSize = 4;
    let grid = [];
    let tiles = [];
    let tileIdCounter = 0;
    let score = 0;
    let bestScore = 0;
    let historyStack = [];
    let isMoving = false;

    let startX = 0, startY = 0;

    const menuScreen = document.getElementById('menu-screen');
    const gameScreen = document.getElementById('game-screen');
    const gridBg = document.getElementById('grid-bg');
    const tileContainer = document.getElementById('tile-container');
    const boardContainer = document.getElementById('board-container');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('best-score');
    const btnContinue = document.getElementById('btn-continue');

    // Sayfa Yüklendiğinde Kayıtlı Verileri Oku
    window.onload = () => {
        loadBestScore();
        checkLocalStorage();
    };

    function loadBestScore() {
        const savedBest = localStorage.getItem('kutay2048_best_score');
        if (savedBest) {
            bestScore = parseInt(savedBest, 10);
            bestScoreEl.innerText = bestScore;
        }
    }

    function checkLocalStorage() {
        const savedGame = localStorage.getItem('kutay2048_game_save');
        if (savedGame) {
            btnContinue.classList.remove('hidden');
        } else {
            btnContinue.classList.add('hidden');
        }
    }

    // Tarayıcı Hafızasına Kalıcı Kaydetme (localStorage)
    function saveToLocalStorage() {
        const data = {
            gridSize,
            grid,
            score,
            tiles: tiles.map(t => ({ id: t.id, r: t.r, c: t.c, val: t.val }))
        };
        localStorage.setItem('kutay2048_game_save', JSON.stringify(data));
        localStorage.setItem('kutay2048_best_score', bestScore.toString());
        checkLocalStorage();
    }

    function showMenu() {
        saveToLocalStorage();
        gameScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
    }

    function resumeGame() {
        const savedData = localStorage.getItem('kutay2048_game_save');
        if (!savedData) return;
        
        const data = JSON.parse(savedData);
        gridSize = data.gridSize;
        grid = data.grid;
        score = data.score;
        
        menuScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        
        setupBoardLayout();
        updateScore(0);
        
        tileContainer.innerHTML = '';
        tiles = [];
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (grid[r][c] !== 0) {
                    createTileElement(r, c, grid[r][c]);
                }
            }
        }
    }

    function startNewGame(size) {
        gridSize = size;
        menuScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        setupBoardLayout();
        restartGame();
    }

    function setupBoardLayout() {
        gridBg.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
        gridBg.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
        
        const boardWidth = Math.min(window.innerWidth - 60, 440);
        boardContainer.style.width = `${boardWidth}px`;
        boardContainer.style.height = `${boardWidth}px`;
        
        gridBg.innerHTML = '';
        for (let i = 0; i < gridSize * gridSize; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            gridBg.appendChild(cell);
        }
    }

    function restartGame() {
        grid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
        tileContainer.innerHTML = '';
        tiles = [];
        score = 0;
        historyStack = [];
        gameOverOverlay.classList.add('hidden');
        updateScore(0);
        addRandomTile();
        addRandomTile();
        saveToLocalStorage();
    }

    function saveState() {
        if (historyStack.length >= 5) historyStack.shift();
        historyStack.push({
            grid: JSON.parse(JSON.stringify(grid)),
            score: score
        });
    }

    function undoMove() {
        if (historyStack.length === 0 || isMoving) return;
        const lastState = historyStack.pop();
        grid = lastState.grid;
        score = lastState.score;
        gameOverOverlay.classList.add('hidden');
        updateScore(0);
        
        tileContainer.innerHTML = '';
        tiles = [];
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (grid[r][c] !== 0) {
                    createTileElement(r, c, grid[r][c]);
                }
            }
        }
        saveToLocalStorage();
    }

    function getCellSize() {
        return (boardContainer.clientWidth - 20 - (gridSize - 1) * 10) / gridSize;
    }

    function applyFontSize(el, val, cellSize) {
        let digits = val.toString().length;
        let baseSize = cellSize * 0.45;

        if (digits === 3) baseSize = cellSize * 0.38;
        if (digits === 4) baseSize = cellSize * 0.30;
        if (digits >= 5) baseSize = cellSize * 0.24;

        el.style.fontSize = `${baseSize}px`;
    }

    function createTileElement(r, c, val) {
        const cellSize = getCellSize();
        const tile = document.createElement('div');
        const id = ++tileIdCounter;

        let tileClass = val <= 2048 ? `tile-${val}` : 'tile-super';
        tile.className = `tile ${tileClass} tile-new`;
        tile.innerText = val;

        let left = c * (cellSize + 10);
        let top = r * (cellSize + 10);

        tile.style.width = `${cellSize}px`;
        tile.style.height = `${cellSize}px`;
        
        applyFontSize(tile, val, cellSize);

        tile.style.transform = `translate3d(${left}px, ${top}px, 0)`;

        tileContainer.appendChild(tile);

        const tileObj = { id, el: tile, r, c, val };
        tiles.push(tileObj);
        return tileObj;
    }

    function updateTilePosition(tileObj, newR, newC) {
        const cellSize = getCellSize();
        tileObj.r = newR;
        tileObj.c = newC;
        let left = newC * (cellSize + 10);
        let top = newR * (cellSize + 10);
        tileObj.el.style.transform = `translate3d(${left}px, ${top}px, 0)`;
    }

    function addRandomTile() {
        let emptyCells = [];
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (grid[r][c] === 0) emptyCells.push({r, c});
            }
        }
        if (emptyCells.length > 0) {
            let {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            let val = Math.random() < 0.9 ? 2 : 4;
            grid[r][c] = val;
            createTileElement(r, c, val);
        }
    }

    function updateScore(amount) {
        score += amount;
        scoreEl.innerText = score;
        if (score > bestScore) {
            bestScore = score;
            bestScoreEl.innerText = bestScore;
            localStorage.setItem('kutay2048_best_score', bestScore.toString());
        }
    }

    function move(direction) {
        if (isMoving) return;
        isMoving = true;
        saveState();

        let moved = false;
        let mergedTilesToRemove = [];

        let vector = { r: 0, c: 0 };
        if (direction === 'UP') vector.r = -1;
        if (direction === 'DOWN') vector.r = 1;
        if (direction === 'LEFT') vector.c = -1;
        if (direction === 'RIGHT') vector.c = 1;

        let rRange = [];
        let cRange = [];
        for (let i = 0; i < gridSize; i++) {
            rRange.push(i);
            cRange.push(i);
        }
        if (direction === 'DOWN') rRange.reverse();
        if (direction === 'RIGHT') cRange.reverse();

        let mergedFlags = Array(gridSize).fill().map(() => Array(gridSize).fill(false));

        rRange.forEach(r => {
            cRange.forEach(c => {
                if (grid[r][c] === 0) return;

                let tileObj = tiles.find(t => t.r === r && t.c === c);
                if (!tileObj) return;

                let currR = r;
                let currC = c;
                let nextR = currR + vector.r;
                let nextC = currC + vector.c;

                while (nextR >= 0 && nextR < gridSize && nextC >= 0 && nextC < gridSize) {
                    if (grid[nextR][nextC] === 0) {
                        currR = nextR;
                        currC = nextC;
                    } else if (grid[nextR][nextC] === grid[r][c] && !mergedFlags[nextR][nextC]) {
                        currR = nextR;
                        currC = nextC;
                        break;
                    } else {
                        break;
                    }
                    nextR += vector.r;
                    nextC += vector.c;
                }

                if (currR !== r || currC !== c) {
                    moved = true;

                    if (grid[currR][currC] === grid[r][c] && (currR !== r || currC !== c)) {
                        let targetVal = grid[r][c] * 2;
                        grid[currR][currC] = targetVal;
                        grid[r][c] = 0;
                        mergedFlags[currR][currC] = true;

                        updateTilePosition(tileObj, currR, currC);
                        mergedTilesToRemove.push(tileObj);

                        let targetTileObj = tiles.find(t => t.r === currR && t.c === currC && !mergedTilesToRemove.includes(t));
                        if (targetTileObj) mergedTilesToRemove.push(targetTileObj);

                        updateScore(targetVal);

                        setTimeout(() => {
                            let newMergedTile = createTileElement(currR, currC, targetVal);
                            newMergedTile.el.classList.remove('tile-new');
                            newMergedTile.el.classList.add('tile-merged');
                        }, 120);

                    } else {
                        grid[currR][currC] = grid[r][c];
                        grid[r][c] = 0;
                        updateTilePosition(tileObj, currR, currC);
                    }
                }
            });
        });

        if (moved) {
            setTimeout(() => {
                mergedTilesToRemove.forEach(t => {
                    if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
                    tiles = tiles.filter(item => item !== t);
                });

                addRandomTile();
                saveToLocalStorage();

                if (checkGameOver()) {
                    setTimeout(() => gameOverOverlay.classList.remove('hidden'), 200);
                }
                isMoving = false;
            }, 130);
        } else {
            historyStack.pop();
            isMoving = false;
        }
    }

    function checkGameOver() {
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (grid[r][c] === 0) return false;
                if (c < gridSize - 1 && grid[r][c] === grid[r][c + 1]) return false;
                if (r < gridSize - 1 && grid[r][c] === grid[r + 1][c]) return false;
            }
        }
        return true;
    }

    // --- KONTROLLER ---
    window.addEventListener('keydown', e => {
        if (gameScreen.classList.contains('hidden')) return;
        if (e.key === 'ArrowLeft' || e.key === 'a') move('LEFT');
        if (e.key === 'ArrowRight' || e.key === 'd') move('RIGHT');
        if (e.key === 'ArrowUp' || e.key === 'w') move('UP');
        if (e.key === 'ArrowDown' || e.key === 's') move('DOWN');
    });

    function handleStart(x, y) {
        startX = x;
        startY = y;
    }

    function handleEnd(x, y) {
        if (gameScreen.classList.contains('hidden')) return;
        let dx = x - startX;
        let dy = y - startY;

        if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'RIGHT' : 'LEFT');
            } else {
                move(dy > 0 ? 'DOWN' : 'UP');
            }
        }
    }

    boardContainer.addEventListener('touchstart', e => handleStart(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
    boardContainer.addEventListener('touchend', e => handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY), {passive: true});

    boardContainer.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    boardContainer.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));
</script>

</body>
</html>
